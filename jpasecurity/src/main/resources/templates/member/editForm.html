<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><title>회원 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/member/list">JpaSecurity 회원관리</a>
        <span class="text-white">
 <i class="bi bi-person-circle"></i> <sec:authentication property="name"/> 님
 </span>
    </div>
</nav>
<div class="container"><div class="row justify-content-center"><div class="col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square"></i> 회원 수정
                <small class="ms-2">ID: <span th:text="${member.id}"></span></small>
            </h5>
        </div>
        <div class="card-body">
            <!-- @RequestParam으로 name, email, phone 값을 수신 -->
            <!-- th:action으로 CSRF 토큰 자동 삽입 -->
            <form th:action="@{/member/edit/{id}(id=${member.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">이름 <span class="textdanger">*</span></label>
                    <!-- th:value: DB에서 가져온 현재 값을 미리 채워줌 -->
                    <input type="text" name="name" th:value="${member.name}"
                           class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">이메일 <span class="textdanger">*</span></label>
                    <input type="email" name="email" th:value="${member.email}"
                           class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">전화번호 <span class="text-muted">(선
택)</span></label>
                    <!-- phone이 null이면 빈 문자열로 처리 -->
                    <input type="text" name="phone"
                           th:value="${member.phone != null ? member.phone : ''}"
                           class="form-control" placeholder="010-1234-5678">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">아이디(로그인 ID)</label>
                    <!-- readonly: 읽기 전용 (수정 불가, 서버로 전송 안 됨) -->
                    <!-- bg-light: 수정 불가 필드임을 시각적으로 표시 -->
                    <input type="text" th:value="${member.username}"
                           class="form-control bg-light" readonly>
                    <div class="form-text text-muted">아이디는 변경할 수 없습니다.</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save"></i> 수정 저장
                    </button>
                    <a href="/member/list" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 목록으로
                    </a>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
